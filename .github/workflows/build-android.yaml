name: Build Nekogram

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: "21"
      TARGET_ABI: "arm64-v8a"
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.1.0"
      ANDROID_NDK_VERSION: "27.3.13750724"
      ANDROID_CMAKE_VERSION: "4.0.2"
      EXTRA_APP_ID: ${{ secrets.NEKO_APP_ID }}
      EXTRA_APP_HASH: ${{ secrets.NEKO_APP_HASH }}
      EXTRA_PLAYSTORE_APP_URL: ${{ secrets.NEKO_PLAYSTORE_APP_URL }}
      EXTRA_WS_USER_AGENT: ${{ secrets.NEKO_WS_USER_AGENT }}
      EXTRA_WS_CONN_HASH: ${{ secrets.NEKO_WS_CONN_HASH }}
      EXTRA_WS_DEFAULT_DOMAIN: ${{ secrets.NEKO_WS_DEFAULT_DOMAIN }}
      EXTRA_TWPIC_BOT_USERNAME: ${{ secrets.NEKO_TWPIC_BOT_USERNAME }}
      EXTRA_FORCE_ANALYTICS: ${{ secrets.NEKO_FORCE_ANALYTICS }}
      EXTRA_TLV_URL: ${{ secrets.NEKO_TLV_URL }}
      EXTRA_SENTRY_DSN: ${{ secrets.NEKO_SENTRY_DSN }}
      SIGNING_KEYSTORE_B64: ${{ secrets.NEKO_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.NEKO_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.NEKO_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.NEKO_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.NEKO_GOOGLE_SERVICES_JSON_B64 }}

    strategy:
      matrix:
        type: [debug, release]
        include:
          - type: debug
            task: assembleDebug
            name: "Debug"
          - type: release
            task: assembleRelease
            name: "Release"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Extra.java
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TMessagesProj/src/main/java/tw/nekomimi/nekogram
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def java_string(value: str) -> str:
              return json.dumps(value or "")

          def java_nullable_string(value: str) -> str:
              return "null" if not value else json.dumps(value)

          app_id = os.environ["EXTRA_APP_ID"].strip()
          if not app_id.isdigit():
              raise SystemExit("EXTRA_APP_ID must be an integer")

          force_analytics = os.environ.get("EXTRA_FORCE_ANALYTICS", "").strip().lower()
          if force_analytics not in {"", "true", "false"}:
              raise SystemExit("EXTRA_FORCE_ANALYTICS must be true or false when set")
          force_analytics = force_analytics or "false"

          content = f"""package tw.nekomimi.nekogram;

          import org.telegram.messenger.BuildConfig;

          import java.util.List;

          import tw.nekomimi.nekogram.helpers.UserHelper;
          import tw.nekomimi.nekogram.helpers.remote.ConfigHelper;

          public class Extra {{
              public static final int APP_ID = {app_id};
              public static final String APP_HASH = {java_string(os.environ["EXTRA_APP_HASH"])};

              public static final String PLAYSTORE_APP_URL = {java_string(os.environ.get("EXTRA_PLAYSTORE_APP_URL", ""))};

              public static String WS_USER_AGENT = {java_string(os.environ.get("EXTRA_WS_USER_AGENT", ""))};
              public static String WS_CONN_HASH = {java_string(os.environ.get("EXTRA_WS_CONN_HASH", ""))};
              public static String WS_DEFAULT_DOMAIN = {java_string(os.environ.get("EXTRA_WS_DEFAULT_DOMAIN", ""))};

              public static String TWPIC_BOT_USERNAME = {java_nullable_string(os.environ.get("EXTRA_TWPIC_BOT_USERNAME", ""))};

              public static boolean FORCE_ANALYTICS = {force_analytics};

              public static String TLV_URL = {java_string(os.environ.get("EXTRA_TLV_URL", ""))};

              public static String SENTRY_DSN = {java_string(os.environ.get("EXTRA_SENTRY_DSN", ""))};

              public static boolean isDirectApp() {{
                  return "release".equals(BuildConfig.BUILD_TYPE) || "debug".equals(BuildConfig.BUILD_TYPE);
              }}

              public static List<ConfigHelper.News> getDefaultNews() {{
                  return null;
              }}

              public static UserHelper.BotInfo getHelperBot() {{
                  return null;
              }}

              public static UserHelper.UserInfoBot getUserInfoBot(boolean fallback) {{
                  return null;
              }}

              public static boolean isTrustedBot(long id) {{
                  return false;
              }}
          }}
          """

          Path("TMessagesProj/src/main/java/tw/nekomimi/nekogram/Extra.java").write_text(content, encoding="utf-8")
          PY


      - name: Build with Gradle
        run: ./gradlew TMessagesProj_App:${{ matrix.task }}

      - name: Extract Version
        run: |
          grep VERSION_NAME TMessagesProj/build/generated/source/buildConfig/${{ matrix.type }}/org/telegram/messenger/BuildConfig.java | cut -d'"' -f 2 > ver.txt || echo "unknown" > ver.txt
          echo "VERSION=$(cat ver.txt)" >> $GITHUB_ENV

      - name: Prepare Artifact
        run: |
          mkdir -p artifact
          if [ "${{ matrix.type }}" == "release" ]; then
            find TMessagesProj_App/build/outputs/apk/release -name "*.apk" -exec cp {} "artifact/Nekogram_$(cat ver.txt)_${{ matrix.name }}.apk" \;
          else
            find TMessagesProj_App/build/outputs/apk/debug -name "*.beta.apk" -exec cp {} "artifact/Nekogram_$(cat ver.txt)_${{ matrix.name }}.apk" \;
            find TMessagesProj_App/build/outputs/apk/debug -name "*.apk" ! -name "*.beta.apk" -exec cp {} "artifact/Nekogram_$(cat ver.txt)_${{ matrix.name }}.apk" \; || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nekogram-${{ matrix.type }}
          path: artifact/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Download debug artifact
        uses: actions/download-artifact@v4
        with:
          name: Nekogram-debug
          path: debug_asset

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: Nekogram-release
          path: release_asset

      - name: Get version info
        run: |
          find release_asset -name "*.apk" | head -1 | sed 's/.*Nekogram_//;s/_Release\.apk//' > version.txt || echo "build" > version.txt
          echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: |
            debug_asset/*
            release_asset/*
          tag_name: v${{ env.VERSION }}
          name: "Nekogram ${{ env.VERSION }}"
          body: "Automated build of Nekogram version ${{ env.VERSION }}"
